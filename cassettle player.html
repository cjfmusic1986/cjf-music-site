<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="cassette.css">
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar">
  <div class="logo">CJF</div>

  <button class="menu-toggle" aria-label="Toggle navigation">☰</button>

  </ul>
</nav>

<!-- CASSETTE -->
<div class="cassette">

  <div class="label">
    <h1>CJF MUSIC</h1>
  </div>

  <div class="window">
    <div class="reel left"></div>
    <div class="reel right"></div>
    <div class="tape"></div>
  </div>

  <audio id="audio">
    <source src="music/A.S.H.E.mp3" type="audio/mpeg">
  </audio>

  <div class="controls">
    <button onclick="playTape()">PLAY</button>
    <button onclick="pauseTape()">PAUSE</button>
  </div>

</div>

<!-- FOOTER -->
<footer>
  <p>&copy; 2026 CJF Music. All rights reserved.</p>
  <p>
    Contact:
    <a href="mailto:cjfproductions1986@gmail.com">

  <p>
    For Beats:

      Linktree
    </a>
  </p>

<!-- SCRIPTS -->
<script>
const audio = document.getElementById("audio");
const reels = document.querySelectorAll(".reel");

function playTape(){
  audio.play();
  reels.forEach(r => r.classList.add("spin"));
}

function pauseTape(){
  audio.pause();
  reels.forEach(r => r.classList.remove("spin"));
}
</script>

<script>
const toggle = document.querySelector('.menu-toggle');
const navLinks = document.querySelector('.nav-links');

toggle.addEventListener('click', () => {
  navLinks.classList.toggle('active');
});
</script>

</body>
